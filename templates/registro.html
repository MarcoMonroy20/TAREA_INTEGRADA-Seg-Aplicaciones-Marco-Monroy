{% extends 'base.html' %}
{% block contenido %}
<div class="encabezado"><p class="sobretitulo">Nueva cuenta</p><h1>Registro de estudiante</h1><p>Use únicamente información ficticia para este laboratorio.</p></div>
<section class="panel ancho"><form method="post"><input type="hidden" name="csrf_token" value="{{ session['csrf'] }}">
<div class="columnas"><div><label for="nombre">Nombre</label><input id="nombre" name="nombre" minlength="2" maxlength="60" required></div><div><label for="apellido">Apellido</label><input id="apellido" name="apellido" minlength="2" maxlength="60" required></div></div>
<label for="carnet">Identificador de estudiante</label><input id="carnet" name="carnet" placeholder="MASI-0003" pattern="MASI-[0-9]{4}" required>
<label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" maxlength="254" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" aria-describedby="ayuda-password" required><small id="ayuda-password">Entre 12 y 128 caracteres.</small>
<button type="submit">Crear cuenta</button></form><p><a href="{{ url_for('login') }}">Volver al ingreso</a></p></section>
{% endblock %}
